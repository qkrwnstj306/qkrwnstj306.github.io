publications:
  - title: "I2AM: Interpreting Image-to-Image Latent Diffusion Models via Bi-Attribution Maps"
    authors: Junseo Park and Hyeryung Jang
    venue: ICLR 2025
    venue_full: The Thirteenth International Conference on Learning Representations (ICLR), 2025
    type: Conference
    thumbnail: assets/img/posts/i2am_1.png
    tldr: Bidirectional attribution maps that explain how image-to-image diffusion models transfer information from the reference image to the generated image.
    page: blog/i2am
    links:
      - { label: Paper, url: "https://openreview.net/forum?id=bBNUiErs26" }
      - { label: Poster, url: "https://github.com/qkrwnstj306/Theory/blob/main/research/i2am/i2am-iclr-poster.pdf" }
  - title: "StyleForge: Enhancing Text-to-Image Synthesis for Any Artistic Styles with Dual Binding"
    authors: Junseo Park, Beomseok Ko, and Hyeryung Jang
    venue: Applied Sciences 2025
    venue_full: Applied Sciences (MDPI), vol. 15, no. 19, 10623, 2025
    type: Journal
    thumbnail: assets/img/posts/styleforge_1.png
    tldr: Dual binding with multiple style tokens learns any artistic style from 15–20 images while improving text–image alignment.
    page: blog/styleforge
    links:
      - { label: Paper, url: "https://doi.org/10.3390/app151910623" }
      - { label: arXiv, url: "https://arxiv.org/abs/2404.05256" }
  - title: "StyleBoost: A Study of Personalizing Text-to-Image Generation in Any Style using DreamBooth"
    authors: Junseo Park, Beomseok Ko, and Hyeryung Jang
    venue: ICTC 2023
    venue_full: International Conference on Information and Communication Technology Convergence (ICTC), 2023
    type: Conference
    thumbnail: assets/img/posts/styleboost_1.png
    tldr: Personalizes Stable Diffusion to an artistic style with DreamBooth by pairing style reference images with carefully chosen auxiliary images.
    page: blog/styleboost
    links:
      - { label: Paper, url: "https://ieeexplore.ieee.org/document/10392676" }
      - { label: Slides, url: "https://github.com/qkrwnstj306/Theory/blob/main/research/styleboost/styleboost-slides.pptx" }

