projects:
  - title: Robust QA with DistilBERT
    summary: Improved out-of-domain question answering (F1 48.41 → 50.31, EM 31.94 → 35.12) with QA-aware text augmentation and AutoML.
    description: >-
      Developed a robust question answering model using DistilBERT trained on SQuAD, NewsQA, and Natural Questions.
      Improved out-of-domain performance using QA-specific text augmentation (EDA) and AutoML-based hyperparameter
      optimization, increasing F1 from 48.41 to 50.31 and EM from 31.94 to 35.12.
    start: "2024.03"
    end: "2024.06"
    type: Individual project
    tags: [NLP, DistilBERT, Data Augmentation]
    thumbnail: assets/img/posts/robustqa_1.png
    page: proj/robustqa
    github: https://github.com/qkrwnstj306/Robust-QA
  - title: Real-Time Text-to-Image Synthesis with LCM-LoRA
    summary: A Flask web service that generates SDXL images in near real time by attaching an LCM-LoRA adapter, with ChatGPT-assisted prompts.
    description: >-
      Built a real-time text-to-image generation service using SDXL with LCM-LoRA to reduce diffusion steps to 1–4.
      Implemented a Flask-based web interface enabling near real-time image synthesis from user prompts.
    start: "2024.03"
    end: "2024.04"
    type: Individual project
    tags: [SDXL, LCM-LoRA, Flask]
    thumbnail: assets/img/posts/realtime_demo.gif
    page: proj/realtime
    github: https://github.com/qkrwnstj306/Text-to-Image-Toy-Project
  - title: Reinforcement Learning Practice
    summary: From-scratch implementations of DQN, DDQN, PPO, A2C/A3C and DDPG, tested on Gym, Unity ML-Agents and a UAV positioning task.
    description: >-
      Implemented core reinforcement learning algorithms (DQN, DDQN, PPO, A2C, DDPG) based on David Silver's lectures
      and research papers. Applied the algorithms to a UAV path planning task to study efficient autonomous navigation.
    start: "2023.03"
    end: "2023.11"
    type: Individual project
    tags: [Reinforcement Learning, PyTorch, Unity]
    thumbnail: assets/img/posts/rl_1_thumbnail.jpg
    page: proj/rl
    github: https://github.com/qkrwnstj306/Reinforcement
  - title: Consistent Web Novel Illustration Generation
    summary: An AI service that keeps web-novel characters consistent across illustrations by binding each character to a token with DreamBooth.
    description: >-
      Developed a diffusion-based illustration generation system for web novels that produces consistent character
      images. Implemented DreamBooth personalization on Latent Diffusion Models and built a server pipeline to
      generate stable character illustrations within ~30 seconds.
    start: "2023.03"
    end: "2023.07"
    type: Team project (Capstone Design, 4 members)
    role: Built the AI server and trained a DreamBooth-based personalization model for consistent character generation.
    tags: [Stable Diffusion, DreamBooth, Personalization]
    thumbnail: assets/img/posts/webnovel_1.png
    page: proj/consistent-web-novel
    github: https://github.com/qkrwnstj306/capston_design

