    I am a Ph.D. student at Dongguk University, advised by
    [Prof. Hyeryung Jang](https://sites.google.com/view/d-ion-lab/home).
    My research focuses on computer vision, particularly **image generation with diffusion models**.
    I am fascinated by the powerful prior of large diffusion models and work on
    **explainable AI (XAI)** for generative models and its applications to **image editing,
    style personalization, and optimization**.
