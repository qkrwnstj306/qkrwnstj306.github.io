<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site_url }}{{ path }}">
  <meta property="og:image" content="{{ site_url }}/{{ og_image }}">
  <link rel="canonical" href="{{ site_url }}{{ path }}">
  <link rel="icon" href="/assets/img/favicon.ico">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  {% if math %}
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
  {% endif %}
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">{{ p.name }}</a>
      <nav class="nav-links" aria-label="Main">
        <a href="/#about">About</a>
        <a href="/#news">News</a>
        <a href="/#publications">Publications</a>
        <a href="/#projects">Projects</a>
        <a href="/#education">Education</a>
        <a href="{{ p.notes }}">Notes</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      </button>
    </div>
  </header>

  <main>
    {% block main %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <strong>{{ p.name }}</strong> · {{ p.role }}, {{ p.affiliation }}
      </div>
      <div class="footer-links">
        <a href="mailto:{{ p.email }}">{{ p.email }}</a>
        <a href="{{ p.github }}">GitHub</a>
        <a href="{{ p.notes }}">Paper notes</a>
      </div>
    </div>
  </footer>
  <script src="/assets/site.js"></script>
</body>
</html>
